[package]
name = "robot-hal-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytes = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
prost = { workspace = true }
robot-hal-core = { path = "../robot-hal-core", version = "=0.5.0-rc.1"}
robot-hal-can = { path = "../robot-hal-can", version = "=0.5.0-rc.1"}
robot-hal-camera = { path = "../robot-hal-camera", version = "=0.5.0-rc.1"}
robot-hal-gpio = { path = "../robot-hal-gpio", version = "=0.5.0-rc.1"}
robot-hal-protocol = { path = "../robot-hal-protocol", version = "=0.5.0-rc.1"}
robot-hal-runtime = { path = "../robot-hal-runtime", version = "=0.5.0-rc.1"}
robot-hal-serial = { path = "../robot-hal-serial", version = "=0.5.0-rc.1"}
robot-hal-usb = { path = "../robot-hal-usb", version = "=0.5.0-rc.1"}
subtle = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
robot-hal-windows-security = { path = "../../adapters/windows-security", version = "=0.5.0-rc.1"}

[dev-dependencies]
async-trait = { workspace = true }
robot-hal-testkit = { path = "../robot-hal-testkit", version = "=0.5.0-rc.1"}
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
