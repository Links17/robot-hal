[project]
name = "seeed-hal"
version = "0.5.0rc1"
description = "Async Python client for the local Seeed HAL broker"
requires-python = ">=3.11"
dependencies = [
    "protobuf==6.32.1",
    "pywin32==311; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "build==1.3.0",
    "grpcio-tools==1.75.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seeed_hal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
