[package]
name = "seeed-hal-broker-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "seeed-hal-broker"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
seeed-hal-adapter-serialport = { path = "../../adapters/serialport" }
seeed-hal-broker = { path = "../../crates/seeed-hal-broker" }
seeed-hal-protocol = { path = "../../crates/seeed-hal-protocol" }
seeed-hal-runtime = { path = "../../crates/seeed-hal-runtime" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
seeed-hal-windows-file = { path = "../../adapters/windows-file" }
windows-permissions = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
winapi-util = { workspace = true }

[dev-dependencies]
seeed-hal-client = { path = "../../crates/seeed-hal-client" }
seeed-hal-core = { path = "../../crates/seeed-hal-core" }
seeed-hal-serial = { path = "../../crates/seeed-hal-serial" }
seeed-hal-testkit = { path = "../../crates/seeed-hal-testkit" }
serde_json = { workspace = true }
