[package]
name = "seeed-hal-broker-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "seeed-hal-broker"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
seeed-hal-adapter-serialport = { path = "../../adapters/serialport" }
seeed-hal-broker = { path = "../../crates/seeed-hal-broker" }
seeed-hal-protocol = { path = "../../crates/seeed-hal-protocol" }
seeed-hal-runtime = { path = "../../crates/seeed-hal-runtime" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

