[package]
name = "robot-hal-adapter-serialport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
hardware-loopback = []
hardware-tests = ["hardware-loopback"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
percent-encoding = { workspace = true }
robot-hal-core = { path = "../../crates/robot-hal-core", version = "=0.5.0-rc.1"}
robot-hal-serial = { path = "../../crates/robot-hal-serial", version = "=0.5.0-rc.1"}
serial2 = { workspace = true, features = ["unix"] }
serialport = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
] }

[dev-dependencies]
robot-hal-testkit = { path = "../../crates/robot-hal-testkit", version = "=0.5.0-rc.1"}
