name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal --component rustfmt --component clippy
      - name: Check generated protocol
        run: ./scripts/check-generated-protocol.sh
      - name: Check Rust formatting
        run: cargo +1.85 fmt --all --check
      # This runtime closure intentionally includes shared-memory and Windows
      # security backends. Each host builds its own OS implementation; neither
      # needs Linux pkg-config packages or a hardware device adapter build.
      - name: Run Linux-prerequisite-free Rust clippy (only the runtime closure that needs no Linux external native prerequisites)
        run: cargo +1.85 clippy --all-targets -p robot-hal-client -p robot-hal-broker -p robot-hal-can -p robot-hal-camera -p robot-hal-core -p robot-hal-gpio -p robot-hal-protocol -p robot-hal-runtime -p robot-hal-serial -p robot-hal-testkit -p robot-hal-usb -- -D warnings
      - name: Run Linux-prerequisite-free Rust tests (only the runtime closure that needs no Linux external native prerequisites)
        run: cargo +1.85 test -p robot-hal-client -p robot-hal-broker -p robot-hal-can -p robot-hal-camera -p robot-hal-core -p robot-hal-gpio -p robot-hal-protocol -p robot-hal-runtime -p robot-hal-serial -p robot-hal-testkit -p robot-hal-usb
      - name: Run frozen Python and release tests
        run: |
          uv run --project bindings/python --python 3.11 --frozen pytest -q
          uv run --project bindings/python --python 3.11 --frozen pytest -q tests/release
      - name: Check protocol minor matrix
        run: uv run --project bindings/python --python 3.11 --frozen pytest -q tests/conformance/test_minor_matrix.py
      - id: targets
        name: Derive release target matrix
        shell: bash
        run: |
          targets="$(python3 scripts/release/release_tool.py print-target --targets release/targets.toml --format github-matrix)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  platform-conformance:
    needs: source-gate
    strategy:
      matrix:
        include: ${{ fromJSON(needs.source-gate.outputs.targets).include }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal --component rustfmt --component clippy
      - name: Install Linux build prerequisites
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: ./scripts/ci/install-linux-native-prerequisites.sh
      - name: Run Windows shared-memory runtime tests
        if: ${{ runner.os == 'Windows' }}
        run: cargo +1.85 test -p robot-hal-adapter-shared-memory --all-features platform::windows_tests -- --nocapture
      - name: Build production broker
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          broker = Path("target/debug/robot-hal-broker")
          if sys.platform == "win32":
              broker = broker.with_suffix(".exe")
          manifest = Path("ci-evidence/production/broker-manifest.json")
          manifest.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(
              [
                  "cargo",
                  "+1.85",
                  "build",
                  "-p",
                  "robot-hal-broker-app",
                  "--no-default-features",
                  "--features",
                  "${{ matrix.features }}",
              ],
              check=True,
          )
          with manifest.open("wb") as output:
              subprocess.run([str(broker), "--manifest"], check=True, stdout=output)
          subprocess.run(
              [
                  sys.executable,
                  "scripts/release/release_tool.py",
                  "verify-broker-manifest",
                  "--tag",
                  "v0.5.0-rc.1",
                  "--manifest",
                  str(manifest),
                  "--target",
                  "${{ matrix.name }}",
                  "--targets",
                  "release/targets.toml",
                  "--artifact",
                  str(broker),
              ],
              check=True,
          )
      - name: Build and qualify virtual broker
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          broker = Path("target/debug/robot-hal-broker")
          if sys.platform == "win32":
              broker = broker.with_suffix(".exe")
          report = Path("ci-evidence/virtual-conformance.json")
          report.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(
              [
                  "cargo",
                  "+1.85",
                  "build",
                  "-p",
                  "robot-hal-broker-app",
                  "--no-default-features",
                  "--features",
                  "virtual-adapters",
              ],
              check=True,
          )
          with report.open("wb") as output:
              subprocess.run(
                  [
                      sys.executable,
                      "scripts/release/release_tool.py",
                      "run-virtual-conformance",
                      "--platform",
                      "${{ matrix.name }}",
                      "--broker",
                      str(broker),
                      "--repo-root",
                      os.environ["GITHUB_WORKSPACE"],
                      "--command-identity",
                      "ci platform virtual conformance",
                      "--ref",
                      "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  ],
                  check=True,
                  stdout=output,
              )
      - name: Upload conformance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-${{ matrix.name }}
          path: ci-evidence/*.json
          if-no-files-found: error
