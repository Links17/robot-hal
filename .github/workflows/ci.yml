name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate Python protocol bindings
        shell: bash
        run: ./scripts/generate-protocol.sh
      - name: Check generated Python protocol bindings
        shell: bash
        run: git diff --exit-code -- bindings/python/seeed_hal/proto
      - name: Detect workspace packages
        id: workspace
        shell: bash
        run: |
          has_packages="$(cargo metadata --no-deps --format-version 1 | python -c 'import json, sys; print("true" if json.load(sys.stdin)["packages"] else "false")')"
          echo "has-packages=$has_packages" >> "$GITHUB_OUTPUT"
      - name: Check Rust formatting
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        run: cargo fmt --all --check
      - name: Run Rust clippy
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        run: cargo test --workspace --all-features
      - name: Run Python binding tests
        if: ${{ hashFiles('bindings/python/tests/**') != '' }}
        working-directory: bindings/python
        run: uv run --frozen pytest -q
