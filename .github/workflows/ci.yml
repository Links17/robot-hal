name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal --component rustfmt --component clippy
      - &linux-build-prerequisites
        name: Install Linux build prerequisites
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgpiod-dev libudev-dev pkg-config
      - name: Check generated protocol
        run: ./scripts/check-generated-protocol.sh
      - name: Check Rust formatting
        run: cargo +1.85 fmt --all --check
      - name: Run Rust clippy
        run: cargo +1.85 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo +1.85 test --workspace --all-features
      - name: Run frozen Python and release tests
        run: |
          uv run --project bindings/python --python 3.11 --frozen pytest -q
          uv run --project bindings/python --python 3.11 --frozen pytest -q tests/release
      - name: Check protocol minor matrix
        run: uv run --project bindings/python --python 3.11 --frozen pytest -q tests/conformance/test_minor_matrix.py
      - id: targets
        name: Derive release target matrix
        shell: bash
        run: |
          targets="$(python3 scripts/release/release_tool.py print-target --targets release/targets.toml --format github-matrix)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  platform-conformance:
    needs: source-gate
    strategy:
      matrix:
        include: ${{ fromJSON(needs.source-gate.outputs.targets).include }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install Rust 1.85
        shell: bash
        run: rustup toolchain install 1.85 --profile minimal --component rustfmt --component clippy
      - *linux-build-prerequisites
      - name: Build production broker
        shell: bash
        run: |
          cargo +1.85 build -p seeed-hal-broker-app --no-default-features --features "${{ matrix.features }}"
          mkdir -p ci-evidence/production
          broker="target/debug/seeed-hal-broker"
          if [[ "$RUNNER_OS" == "Windows" ]]; then broker="${broker}.exe"; fi
          "$broker" --manifest > ci-evidence/production/broker-manifest.json
          python3 scripts/release/release_tool.py verify-broker-manifest \
            --tag v0.5.0-rc.1 \
            --manifest ci-evidence/production/broker-manifest.json \
            --target "${{ matrix.name }}" \
            --targets release/targets.toml \
            --artifact "$broker"
      - name: Build and qualify virtual broker
        shell: bash
        run: |
          cargo +1.85 build -p seeed-hal-broker-app --no-default-features --features virtual-adapters
          broker="target/debug/seeed-hal-broker"
          if [[ "$RUNNER_OS" == "Windows" ]]; then broker="${broker}.exe"; fi
          python3 scripts/release/release_tool.py run-virtual-conformance \
            --platform "${{ matrix.name }}" \
            --broker "$broker" \
            --repo-root "$GITHUB_WORKSPACE" \
            --command-identity "ci platform virtual conformance" \
            --ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > ci-evidence/virtual-conformance.json
      - name: Upload conformance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-${{ matrix.name }}
          path: ci-evidence/*.json
          if-no-files-found: error
