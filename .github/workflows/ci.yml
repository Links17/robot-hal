name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Check generated Python protocol bindings
        shell: bash
        run: ./scripts/check-generated-protocol.sh
      - name: Detect workspace packages
        id: workspace
        shell: bash
        run: |
          has_packages="$(cargo metadata --no-deps --format-version 1 | python -c 'import json, sys; print("true" if json.load(sys.stdin)["packages"] else "false")')"
          echo "has-packages=$has_packages" >> "$GITHUB_OUTPUT"
      - name: Check Rust formatting
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        run: cargo fmt --all --check
      - name: Run Rust clippy
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        run: cargo test --workspace --all-features
      - name: Verify broker manifests
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        run: |
          cargo test -p seeed-hal-broker-app --no-default-features --test manifest
          cargo test -p seeed-hal-broker-app --features virtual-adapters --test manifest
          cargo test -p seeed-hal-broker-app --features socketcan,pcan,virtual-adapters --test manifest
          cargo test -p seeed-hal-broker-app --features nusb --test manifest
      - name: Check native adapter target paths
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cargo clippy -p seeed-hal-adapter-linux-gpio --all-targets -- -D warnings
            cargo clippy -p seeed-hal-adapter-nusb --all-targets -- -D warnings
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo clippy -p seeed-hal-adapter-windows-gpio --all-targets -- -D warnings
            cargo clippy -p seeed-hal-adapter-nusb --all-targets -- -D warnings
          fi
      - name: Confirm native hardware tests remain ignored
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        shell: bash
        run: |
          cargo test -p seeed-hal-adapter-nusb --test hardware
          cargo test -p seeed-hal-adapter-linux-gpio --test hardware
          cargo test -p seeed-hal-adapter-windows-gpio --test hardware
      - name: Build broker conformance executable
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        run: cargo build -p seeed-hal-broker-app --features virtual-adapters
      - name: Run broker black-box conformance
        if: ${{ steps.workspace.outputs.has-packages == 'true' }}
        shell: bash
        run: |
          broker_path="target/debug/seeed-hal-broker"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            broker_path="${broker_path}.exe"
          fi
          uv run --project bindings/python --frozen pytest -q tests/conformance/test_runner_contract.py
          uv run --project bindings/python --frozen python tests/conformance/run-broker-conformance.py --broker "$broker_path"
      - name: Run Python binding tests
        if: ${{ hashFiles('bindings/python/tests/**') != '' }}
        working-directory: bindings/python
        run: uv run --frozen pytest -q
