name: RC prerelease

on:
  push:
    tags:
      - "v0.5.0-rc.*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing v0.5.0-rc.N tag to release
        required: true
        type: string
      dry_run:
        description: Verify only; do not attest or create a release
        default: false
        required: false
        type: boolean

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Validate immutable tag and checkout identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$TAG"
          [[ "$tag" =~ ^v0\.5\.0-rc\.([1-9][0-9]*)$ ]]
          if [[ "${{ github.event_name }}" == "push" ]]; then
            [[ "${{ github.ref_type }}" == "tag" ]]
            [[ "${{ github.ref_name }}" == "$tag" ]]
          fi
          git fetch --tags origin
          test -z "$(git status --porcelain)"
          commit="$(git rev-parse "${tag}^{commit}")"
          test "$commit" = "$(git rev-list -n 1 "$tag")"
          test "$commit" = "$(git rev-parse HEAD)"
          test "$(git tag --points-at "$commit" | rg -x "$tag")" = "$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release already exists for $tag" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Validate release version and source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/release_tool.py check-version --tag "$TAG" --repo-root .
          ./scripts/check-generated-protocol.sh
          cargo +1.85 fmt --all --check
          cargo +1.85 clippy --workspace --all-targets --no-default-features -- -D warnings
          cargo +1.85 test --workspace --no-default-features
          uv run --project bindings/python --python 3.11 --frozen pytest -q tests/release
      - name: Derive release target matrix
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          targets="$(python3 scripts/release/release_tool.py print-target --targets release/targets.toml --format json)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  platform-build:
    needs: validate
    strategy:
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.targets).include }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85 --profile minimal
      - name: Install Linux build prerequisites
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: ./scripts/ci/install-linux-native-prerequisites.sh
      - name: Build and package production broker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence output
          cargo +1.85 build -p seeed-hal-broker-app --no-default-features --features "${{ matrix.features }}"
          broker="target/debug/seeed-hal-broker"
          if [[ "$RUNNER_OS" == "Windows" ]]; then broker="${broker}.exe"; fi
          "$broker" --manifest > evidence/broker-manifest.json
          python3 scripts/release/release_tool.py verify-broker-manifest --tag "$TAG" --manifest evidence/broker-manifest.json --target "${{ matrix.name }}" --targets release/targets.toml --artifact "$broker"
          python3 scripts/release/release_tool.py package-broker --tag "$TAG" --target "${{ matrix.name }}" --targets release/targets.toml --binary "$broker" --manifest evidence/broker-manifest.json --output-dir output
      - name: Build virtual conformance broker
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85 build -p seeed-hal-broker-app --no-default-features --features virtual-adapters
          virtual="target/debug/seeed-hal-broker"
          if [[ "$RUNNER_OS" == "Windows" ]]; then virtual="${virtual}.exe"; fi
          cp "$virtual" "output/virtual-${{ matrix.name }}"
          shasum -a 256 output/* > output/SHA256SUMS
      - name: Upload immutable platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-platform-${{ env.TAG }}-${{ needs.validate.outputs.commit }}-${{ matrix.name }}
          path: output
          if-no-files-found: error
          overwrite: false

  client-build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Build exact Rust and Python release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/rust output/python
          python3 scripts/release/release_tool.py package-rust --tag "$TAG" --repo-root . --output-dir output/rust
          python3 scripts/release/release_tool.py package-python --tag "$TAG" --project bindings/python --candidate-dir output/python
          shasum -a 256 output/rust/* output/python/* > output/SHA256SUMS
      - name: Upload immutable client artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-client-${{ env.TAG }}-${{ needs.validate.outputs.commit }}
          path: output
          if-no-files-found: error
          overwrite: false

  platform-verify:
    needs: [validate, platform-build]
    strategy:
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.targets).include }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install Linux runtime prerequisites
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: ./scripts/ci/install-linux-native-prerequisites.sh
      - name: Download matching immutable platform artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-platform-${{ env.TAG }}-${{ needs.validate.outputs.commit }}-${{ matrix.name }}
          path: input
      - name: Verify artifact digest and execute isolated conformance broker
        shell: bash
        run: |
          set -euo pipefail
          (cd input && shasum -a 256 --check SHA256SUMS)
          shopt -s nullglob
          archives=(input/seeed-hal-broker-v"${TAG}"-*.tar.gz input/seeed-hal-broker-v"${TAG}"-*.zip)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "expected one production broker archive" >&2
            exit 1
          fi
          production="${archives[0]}"
          if [[ "$production" == *.tar.gz ]]; then
            tar -xzf "$production" -C input
          else
            unzip -q "$production" -d input
          fi
          case "${{ matrix.name }}" in
            macos) triple="aarch64-apple-darwin" ;;
            linux) triple="x86_64-unknown-linux-gnu" ;;
            windows) triple="x86_64-pc-windows-msvc" ;;
            *) exit 1 ;;
          esac
          package="input/seeed-hal-broker-v${TAG}-${triple}"
          production_broker="$package/seeed-hal-broker"
          if [[ "$RUNNER_OS" == "Windows" ]]; then production_broker="${production_broker}.exe"; fi
          "$production_broker" --manifest > production-manifest.json
          python3 scripts/release/release_tool.py verify-broker-manifest --tag "$TAG" --manifest production-manifest.json --target "${{ matrix.name }}" --targets release/targets.toml --artifact "$production_broker"
          broker="input/virtual-${{ matrix.name }}"
          chmod +x "$broker"
          python3 scripts/release/release_tool.py run-virtual-conformance --platform "${{ matrix.name }}" --broker "$broker" --repo-root "$GITHUB_WORKSPACE" --command-identity "release platform artifact verification" --ref "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > virtual.json
          python3 - <<'PY'
          import json, os
          platform = os.environ["PLATFORM"]
          tag = os.environ["TAG"]
          commit = os.environ["COMMIT"]
          virtual = json.load(open("virtual.json", encoding="utf-8"))
          report = {
              "schema": 1, "tag": tag, "commit": commit,
              "qualification": {
                  "software": {"id": "software-conformance", "uri": "https://github.com/" + os.environ["REPOSITORY"] + "/actions/runs/" + os.environ["RUN_ID"]},
                  "hardware": {"id": "hardware-qualification", "uri": "https://github.com/" + os.environ["REPOSITORY"] + "/blob/" + commit + "/docs/contracts/release-artifacts.md"},
              },
              "software": {"status": "Partial", "jobs": [{"platform": platform, "result": "Passed", "command": "release platform artifact verification", "ref": "https://github.com/" + os.environ["REPOSITORY"] + "/actions/runs/" + os.environ["RUN_ID"]}], "virtual": virtual},
              "hardware": {"release-hardware": {"status": "Pending", "evidence": None}},
          }
          with open("conformance-report.json", "w", encoding="utf-8") as output:
              json.dump(report, output, sort_keys=True, separators=(",", ":"))
              output.write("\n")
          PY
        env:
          PLATFORM: ${{ matrix.name }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
      - name: Upload verified platform conformance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ env.TAG }}-${{ needs.validate.outputs.commit }}-${{ matrix.name }}
          path: conformance-report.json
          if-no-files-found: error
          overwrite: false

  aggregate:
    needs: [validate, platform-build, client-build, platform-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-platform-${{ env.TAG }}-${{ needs.validate.outputs.commit }}-*
          path: downloaded/platforms
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-client-${{ env.TAG }}-${{ needs.validate.outputs.commit }}
          path: downloaded/client
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-evidence-${{ env.TAG }}-${{ needs.validate.outputs.commit }}-*
          path: downloaded/evidence
          merge-multiple: false
      - name: Fail closed on downloaded artifact digests and evidence
        shell: bash
        run: |
          set -euo pipefail
          for sums in downloaded/platforms/*/SHA256SUMS downloaded/client/SHA256SUMS; do
            directory="$(dirname "$sums")"
            (cd "$directory" && shasum -a 256 --check SHA256SUMS)
          done
          mkdir report-input
          python3 scripts/release/release_tool.py aggregate-platform-reports \
            --tag "$TAG" \
            --commit "${{ needs.validate.outputs.commit }}" \
            --report-dir downloaded/evidence \
            --output report-input/conformance-report.json
      - name: Aggregate exact release directory and run full verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/brokers inputs/rust inputs/python
          cp downloaded/platforms/macos/*.tar.gz inputs/brokers/
          cp downloaded/platforms/linux/*.tar.gz inputs/brokers/
          cp downloaded/platforms/windows/*.zip inputs/brokers/
          cp downloaded/client/rust/*.tar.gz inputs/rust/
          cp downloaded/client/python/* inputs/python/
          python3 scripts/release/release_tool.py aggregate-release --tag "$TAG" --commit "${{ needs.validate.outputs.commit }}" --broker-dir inputs/brokers --rust-bundle inputs/rust --python-artifacts inputs/python --report-inputs report-input --release-dir release
          python3 scripts/release/release_tool.py verify-static --release-dir release
          python3 scripts/release/release_tool.py verify-artifacts --tag "$TAG" --artifacts-dir release --targets release/targets.toml --repo-root .
          python3 - <<'PY'
          import json
          from scripts.release.release_tool import release_ready, validate_conformance_report
          report = json.load(open("release/conformance-report.json", encoding="utf-8"))
          release_ready(validate_conformance_report(report))
          PY
      - name: Upload immutable final release directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-final-${{ env.TAG }}-${{ needs.validate.outputs.commit }}
          path: release
          if-no-files-found: error
          overwrite: false

  attest-and-release:
    needs: [validate, aggregate]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-final-${{ env.TAG }}-${{ needs.validate.outputs.commit }}
          path: release
      - name: Verify final release directory before attestation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/release_tool.py verify-static --release-dir release
          python3 scripts/release/release_tool.py verify-artifacts --tag "$TAG" --artifacts-dir release --targets release/targets.toml --repo-root .
      - name: Recheck immutable remote tag before attestation
        shell: bash
        run: |
          set -euo pipefail
          require_remote_peeled_tag() {
            local plain peeled remote_commit
            plain="$(git ls-remote --tags origin "refs/tags/$TAG")"
            peeled="$(git ls-remote --tags origin "refs/tags/$TAG^{}")"
            test -n "$plain"
            test "$(printf '%s\n' "$plain" | wc -l | tr -d ' ')" = 1
            if [[ -n "$peeled" ]]; then
              test "$(printf '%s\n' "$peeled" | wc -l | tr -d ' ')" = 1
            fi
            test "$(printf '%s\n' "$peeled" | wc -l | tr -d ' ')" -le 1
            remote_commit="${peeled%%$'\t'*}"
            if [[ -z "$peeled" ]]; then remote_commit="${plain%%$'\t'*}"; fi
            test "$remote_commit" = "${{ needs.validate.outputs.commit }}"
          }
          require_remote_peeled_tag
      - name: Attest exact final release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*
      - name: Create immutable prerelease after attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          require_remote_peeled_tag() {
            local plain peeled remote_commit
            plain="$(git ls-remote --tags origin "refs/tags/$TAG")"
            peeled="$(git ls-remote --tags origin "refs/tags/$TAG^{}")"
            test -n "$plain"
            test "$(printf '%s\n' "$plain" | wc -l | tr -d ' ')" = 1
            if [[ -n "$peeled" ]]; then
              test "$(printf '%s\n' "$peeled" | wc -l | tr -d ' ')" = 1
            fi
            test "$(printf '%s\n' "$peeled" | wc -l | tr -d ' ')" -le 1
            remote_commit="${peeled%%$'\t'*}"
            if [[ -z "$peeled" ]]; then remote_commit="${plain%%$'\t'*}"; fi
            test "$remote_commit" = "${{ needs.validate.outputs.commit }}"
          }
          require_remote_peeled_tag
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists for $TAG" >&2
            exit 1
          fi
          PYTHON_VERSION="${TAG#v}"
          PYTHON_VERSION="${PYTHON_VERSION/-rc./rc}"
          gh release create "$TAG" \
            "release/seeed-hal-broker-v${TAG}-aarch64-apple-darwin.tar.gz" \
            "release/seeed-hal-broker-v${TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "release/seeed-hal-broker-v${TAG}-x86_64-pc-windows-msvc.zip" \
            "release/seeed-hal-crates-v${TAG}.tar.gz" \
            "release/seeed_hal-${PYTHON_VERSION}-py3-none-any.whl" \
            "release/seeed_hal-${PYTHON_VERSION}.tar.gz" \
            "release/release-manifest.json" \
            "release/SHA256SUMS" \
            "release/conformance-report.json" \
            --prerelease --latest=false --verify-tag --title "$TAG"
          require_remote_peeled_tag
