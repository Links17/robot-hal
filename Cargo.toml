[workspace]
resolver = "3"
members = [
    "crates/seeed-hal-core",
    "crates/seeed-hal-runtime",
    "crates/seeed-hal-serial",
    "crates/seeed-hal-testkit",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-serial = "5"
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
