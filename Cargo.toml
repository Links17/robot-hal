[workspace]
resolver = "3"
members = [
    "adapters/avfoundation",
    "adapters/mediafoundation",
    "adapters/v4l2",
    "adapters/pcan",
    "adapters/nusb",
    "adapters/shared-memory",
    "adapters/linux-gpio",
    "adapters/windows-gpio",
    "adapters/socketcan",
    "adapters/serialport",
    "adapters/windows-file",
    "adapters/windows-security",
    "apps/seeed-hal-broker",
    "crates/seeed-hal-client",
    "crates/seeed-hal-broker",
    "crates/seeed-hal-can",
    "crates/seeed-hal-camera",
    "crates/seeed-hal-core",
    "crates/seeed-hal-protocol",
    "crates/seeed-hal-runtime",
    "crates/seeed-hal-serial",
    "crates/seeed-hal-testkit",
    "crates/seeed-hal-usb",
    "crates/seeed-hal-gpio",
]

[workspace.package]
version = "0.5.0-rc.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
can-hal-rs = { version = "=0.4.2", default-features = false, features = ["std"] }
can-hal-pcan = { version = "=0.4.2", default-features = false }
can-hal-socketcan = { version = "=0.4.2", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
libloading = "0.8"
percent-encoding = "2"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial2 = "0.2"
serialport = "4"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-serial = "5"
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
windows-sys = "0.61"
windows-permissions = "0.2.4"
winapi-util = "0.1.11"
zeroize = { version = "1", features = ["derive"] }
